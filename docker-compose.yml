services:
  biblioteca_blue:
    image: mongo:7.0
    container_name: biblioteca_blue
    hostname: biblioteca_blue
    command: ["--replSet", "rs0", "--bind_ip_all", "--port", "27018", "--keyFile", "/etc/mongo-keyfile"]
    ports:
      - "27018:27018"
    volumes:
      - biblioteca_blue_data:/data/db
      - ./mongo-keyfile:/etc/mongo-keyfile:ro
    networks:
      - mongo-net
  replica_biblioteca_blue:
    image: mongo:7.0
    container_name: replica_biblioteca_blue
    hostname: replica_biblioteca_blue
    command: ["--replSet", "rs0", "--bind_ip_all", "--port", "27019", "--keyFile", "/etc/mongo-keyfile"]
    ports:
      - "27019:27019"
    volumes:
      - replica_biblioteca_blue_data:/data/db
      - ./mongo-keyfile:/etc/mongo-keyfile:ro
    networks:
      - mongo-net

  replica_biblioteca_blue2:
    image: mongo:7.0
    container_name: replica_biblioteca_blue2
    hostname: replica_biblioteca_blue2
    command: ["--replSet", "rs0", "--bind_ip_all", "--port", "27020", "--keyFile", "/etc/mongo-keyfile"]
    ports:
      - "27020:27020"
    volumes:
      - replica_biblioteca_blue2_data:/data/db
      - ./mongo-keyfile:/etc/mongo-keyfile:ro
    networks:
      - mongo-net

  postgres:
    image: postgres:16
    container_name: postgres_webservice
    environment:
      POSTGRES_DB: webservicelibros
      POSTGRES_USER: bluebul_web
      POSTGRES_PASSWORD: bluebul123
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - mongo-net

  webservice:
    build: ./biblioteca_blue/ws_LibrosBlue/ws_blue
    container_name: webservice
    ports:
      - "8001:8001"
    depends_on:
      - postgres
    networks:
      - mongo-net

networks:
  mongo-net:
    driver: bridge

volumes:
  biblioteca_blue_data:
  replica_biblioteca_blue_data:
  replica_biblioteca_blue2_data:
  postgres_data: