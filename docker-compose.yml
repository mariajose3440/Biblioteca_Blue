
services:
  biblioteca_blue:
    image: mongo:7.0
    container_name: biblioteca_blue
    hostname: biblioteca_blue
    command: ["--replSet", "rs0", "--bind_ip_all", "--port", "27018", "--keyFile", "/etc/mongo-keyfile"]
    ports:
      - "27018:27018"
    volumes:
      - biblioteca_blue_data:/data/db
      - ./mongo-keyfile:/etc/mongo-keyfile:ro
    networks:
      - mongo-net
 
  replica_biblioteca_blue:
    image: mongo:7.0
    container_name: replica_biblioteca_blue
    hostname: replica_biblioteca_blue
    command: ["--replSet", "rs0", "--bind_ip_all", "--port", "27019", "--keyFile", "/etc/mongo-keyfile"]
    ports:
      - "27019:27019"
    volumes:
      - replica_biblioteca_blue_data:/data/db
      - ./mongo-keyfile:/etc/mongo-keyfile:ro
    networks:
      - mongo-net
 
  replica_biblioteca_blue2:
    image: mongo:7.0
    container_name: replica_biblioteca_blue2
    hostname: replica_biblioteca_blue2
    command: ["--replSet", "rs0", "--bind_ip_all", "--port", "27020", "--keyFile", "/etc/mongo-keyfile"]
    ports:
      - "27020:27020"
    volumes:
      - replica_biblioteca_blue2_data:/data/db
      - ./mongo-keyfile:/etc/mongo-keyfile:ro
    networks:
      - mongo-net
 
  # 👇 NUEVO: inicializa el replica set y crea el usuario bluebul_user.
  # Corre una sola vez y termina (exited 0) -- es normal, no es un servicio permanente.
  mongo-init:
    image: mongo:7.0
    container_name: mongo-init
    depends_on:
      - biblioteca_blue
      - replica_biblioteca_blue
      - replica_biblioteca_blue2
    volumes:
      - ./mongo-init.sh:/scripts/mongo-init.sh:ro
    entrypoint: ["bash", "/scripts/mongo-init.sh"]
    networks:
      - mongo-net
 
  postgres:
    image: postgres:16
    container_name: postgres_webservice
    environment:
      POSTGRES_DB: webservicelibros
      POSTGRES_USER: bluebul_web
      POSTGRES_PASSWORD: bluebul123
    command: >
      postgres
      -c wal_level=replica
      -c max_wal_senders=5
      -c max_replication_slots=5
      -c hot_standby=on
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    networks:
      - mongo-net
 
  postgres_replica:
    image: postgres:16
    container_name: postgres_webservice_replica
    environment:
      PGPASSWORD: replica_docker123
    ports:
      - "5435:5432"
    volumes:
      - postgres_replica_data:/var/lib/postgresql/data
    networks:
      - mongo-net
    depends_on:
      - postgres
    entrypoint: >
      bash -c "
      if [ -z \"$$(ls -A /var/lib/postgresql/data)\" ]; then
        gosu postgres pg_basebackup -h postgres -p 5432 -U replicadorblue_docker -D /var/lib/postgresql/data -Fp -Xs -P -R;
      fi;
      chmod 700 /var/lib/postgresql/data;
      exec gosu postgres postgres -c hot_standby=on
      "
 
  webapplication_bibliotecablue:
    build: ./biblioteca_blue/bibliotecaBlue/biblioteca_blue
    container_name: webapp
    ports:
      - "8000:8000"
    depends_on:
      - mongo-init
    networks:
      mongo-net:
        aliases:
          - webapp
 
  webservice:
    build: ./biblioteca_blue/ws_LibrosBlue/ws_blue
    container_name: webservice
    ports:
      - "8001:8001"
    depends_on:
      - postgres
    networks:
      - mongo-net
 
  dashboardblue:
    build: ./biblioteca_blue/dashboard_blue/dashboard_bibliotecaBlue
    container_name: dashboardblue
    ports:
      - "8002:8002"
    depends_on:
      - biblioteca_blue
      - webapplication_bibliotecablue
    networks:
      - mongo-net
 
networks:
  mongo-net:
    driver: bridge
 
volumes:
  biblioteca_blue_data:
  replica_biblioteca_blue_data:
  replica_biblioteca_blue2_data:
  postgres_data:
  postgres_replica_data:
